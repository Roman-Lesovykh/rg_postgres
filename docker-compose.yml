services:

  # Сервис rg_postgres
  postgres:
    image: "${DOCKER_IMAGE_NAME_POSTGRES}"
    #DOCKER_IMAGE_NAME_POSTGRES="postgres:17" # Название образа в Docker
    container_name: "${DOCKER_CONTAINER_NAME}"
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: ${POSTGRES_PGDATA}
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/${POSTGRES_DATA}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres_net


secrets:
  postgres_password:
    file: ./src/rg_postgres/.env.postgres_password

volumes:
  postgres_data:
    driver: local
    name: "${DOCKER_VOLUME_NAME}"

networks:
  postgres_net:
    driver: bridge